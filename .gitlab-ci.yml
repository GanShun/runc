# No `tags:` anywhere: the only online runner has an empty tag list.
stages:
  - test

image: ubuntu:24.04

variables:
  GO_VERSION: "1.26.1"
  LIBSECCOMP_VERSION: "2.5.5"

.toolchain: &toolchain
  - apt-get update -qq
  - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
      ca-certificates curl gcc git libc6-dev libseccomp-dev make pkg-config
  - curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
  - tar -C /usr/local -xzf /tmp/go.tar.gz
  - export PATH="/usr/local/go/bin:$PATH"
  - go version

# An MR pipeline runs for any target branch, since this stack's MRs target each other.
.rules: &rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
    when: never
  - if: $CI_COMMIT_BRANCH

seccomp-coverage:
  stage: test
  rules: *rules
  before_script: *toolchain
  script:
    - make cover
  coverage: '/coverage: ([0-9]+\.[0-9]+)% of statements/'
  artifacts:
    expose_as: 'seccomp coverage'
    paths:
      - coverage.html
    expire_in: 30 days

seccomp-table-drift:
  stage: test
  rules: *rules
  before_script: *toolchain
  script:
    - test "$(pkg-config --modversion libseccomp)" = "$LIBSECCOMP_VERSION"
    - CGO_ENABLED=1 go test -tags seccomp -run TestGeneratedTablesMatchCommitted ./libcontainer/seccomp/

# The cgo-free unit tests. `make cover` only reaches the seccomp package, and the
# integration job needs a privileged runner, so without this job the parent-side
# writes, the staging wiring and the config refusals are tested nowhere but on a
# developer's machine. They need no privileges, so they run on the shared runner.
libcontainer-unit:
  stage: test
  rules: *rules
  before_script: *toolchain
  script:
    - CGO_ENABLED=0 go test ./libcontainer/ -count=1

# The differential against libseccomp needs cgo, so `make cover` never runs it:
# it is CGO_ENABLED=0. Without this job nothing in CI compares the two
# compilers, and a libseccomp version skew lands unnoticed.
seccomp-differential:
  stage: test
  rules: *rules
  before_script: *toolchain
  script:
    - test "$(pkg-config --modversion libseccomp)" = "$LIBSECCOMP_VERSION"
    - CGO_ENABLED=1 go test -tags seccomp ./libcontainer/seccomp/

# The VM differential: the only check that compares what the *kernel* does with
# each build's filter. Manual, because it boots QEMU under TCG -- the runner has
# no /dev/kvm -- and that cost belongs in front of a person, not in every MR
# until its runtime is measured.
vmdiff:
  stage: test
  rules: *rules
  when: manual
  allow_failure: true
  timeout: 1h
  before_script: *toolchain
  script:
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends cpio linux-image-generic qemu-system-x86
    - export PATH="/usr/local/go/bin:$PATH"
    - kernel=$(ls /boot/vmlinuz-* | head -1); echo "booting $kernel"
    - ./libcontainer/seccomp/vmdiff/run.sh "$kernel"
    - mkdir -p ci-logs && cp /tmp/vmdiff-run/console.log ci-logs/ 2>/dev/null || true
  artifacts:
    when: always
    expose_as: 'vmdiff console'
    paths:
      - ci-logs
    expire_in: 30 days

# The root-only tests: real namespaces, real mounts, a real cgroup. They need
# CAP_SYS_ADMIN and a writable cgroupfs, so the job probes for both first and
# says so, rather than reporting a test failure that reads like a code defect.
libcontainer-integration:
  stage: test
  rules: *rules
  when: manual
  allow_failure: true
  timeout: 30m
  before_script: *toolchain
  script:
    - |
      if ! unshare --mount --pid --fork true 2>/dev/null; then
        echo "this runner cannot create namespaces: the pod needs CAP_SYS_ADMIN (privileged: true)"
        echo "the job comment above says why, and what the tests need"
        exit 1
      fi
      echo "namespaces: ok"
    - |
      if ! (mkdir /sys/fs/cgroup/k4s-probe 2>/dev/null && rmdir /sys/fs/cgroup/k4s-probe); then
        echo "this runner has no writable cgroupfs, so libcontainer cannot create the container's cgroup"
        exit 1
      fi
      echo "cgroupfs: writable"
      # -skip Userns is load-bearing: the -run regex also matches TestExecInUserns
      # and TestExecInUsernsRlimit, whose only skip is needUserNS (it skips when
      # /proc/self/ns/user is absent, which a privileged runner has). The cgo-free
      # build cannot create a user namespace, so they belong below with the other
      # known-unsupported case, not here where they would paint the job red.
    - CGO_ENABLED=0 go test ./libcontainer/integration/ -count=1 -v -skip Userns
        -run 'TestExecIn|TestEnter|TestIPCJoinPath|TestPIDHost|TestHostPidnsInitKill'
    - |
      # Two cases this build cannot support: a container init cannot join a PID
      # namespace by path, and a user namespace cannot be joined or created at
      # all. They must fail, and they must fail *for that reason* -- a bare
      # "|| true" would also swallow a regression, or a pass that means the
      # limitation is gone and the test belongs in the step above.
      out=/tmp/expected-failures.log
      CGO_ENABLED=0 go test ./libcontainer/integration/ -count=1 -v \
        -run 'TestInitJoinPID|TestInitJoinNetworkAndUser|TestExecInUserns$|TestExecInUsernsRlimit$' \
        > "$out" 2>&1 || true
      cat "$out"
      # A file, not a pipe into grep -q: under pipefail a grep that exits early
      # gives the writer SIGPIPE and the pipeline reports failure.
      for test in TestInitJoinPID TestInitJoinNetworkAndUser TestExecInUserns TestExecInUsernsRlimit; do
        # Anchored through the " (", so TestExecInUserns does not match the
        # TestExecInUsernsRlimit line.
        if ! grep -q -e "^--- FAIL: $test (" "$out"; then
          echo "$test did not fail: either it now passes (move it to the step above) or it did not run" >&2
          exit 1
        fi
      done
      grep -q -e 'not supported without cgo' -e 'operation not permitted' "$out" || {
        echo "the expected failures did not report the documented refusal" >&2
        exit 1
      }
